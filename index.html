/* Layout: header over a map of photo thumbnails on colored neighborhood blocks (left) and the archive panel (right); stacks on phones.
   Deliberately one look: white page, black monospace text, color only in the neighborhood blocks and model verdicts. */
:root{
  color-scheme:light;
  --paper:#ffffff; --surface:#ffffff; --hover:#f2f2f2; --ink:#000000; --muted:#5e5e5e; --line:#d6d6d6;
  --land:#f1f1f1; --water:#ffffff; --coast:#b5b5b5;
  --accent:#000000; --accent-ink:#ffffff; --doubt:#e2470c; --agree:#14924c; --none:#a8a8a8;
  --n1:#7aaeff; --n2:#c4a2ff; --n3:#f5a3d6; --n4:#5fd9b4; --n5:#b8e05a; --n6:#ffd23f; --n7:#ff9466; --n8:#8fe3e8; --n9:#e3c48a; --n10:#a3a8ff;
  --c1:#2f6fe0; --c2:#e2470c; --c3:#14924c; --c4:#b88a00; --c5:#8a3fd1; --c6:#0d8f9c; --c7:#d1306b; --c8:#5c7a12;
  --f-display:"Apfel Grotezk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Apfel Grotezk","Helvetica Neue",Arial,sans-serif;
  --f-title:"Apfel Grotezk","Helvetica Neue",Arial,sans-serif;
  --f-brand:"Apfel Grotezk Brukt","Apfel Grotezk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Apfel Grotezk","Helvetica Neue",Arial,sans-serif;
  --r:0px;
}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.5}
.btn:hover,.chip:hover{background:var(--hover)}
.btn.primary:hover{background:#262626}
.tally .warn b{color:var(--ink)!important}
.thumb{cursor:pointer}
.thumb:focus{outline:none}
.blocklbl{font-family:var(--f-title);font-weight:400;fill:#000;letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
/* thumbnails: hover enlarges, the carousel spotlights a few at a time */
.thumb .ti{transition:filter .2s}
body.front .block{fill-opacity:0;stroke-opacity:0}
body.front .blocklbl{display:none}
.hiarea{fill-opacity:.2;stroke-width:2.5;stroke-linejoin:round;pointer-events:none;transition:opacity .15s}
.hiname{font-family:var(--f-title);fill:#000;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.nta{fill:none;stroke:#bfbfbf;stroke-width:.8;stroke-linejoin:round}
.thumb.hover .ti, .thumb.picked .ti{filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.thumb .cap{opacity:0;transition:opacity .25s;font-family:var(--f-mono);font-weight:500;fill:#000;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}

@media (prefers-reduced-motion:reduce){.thumb .ti{transition:none}}
.how{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0;font-size:12.5px;line-height:1.5}
.how dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding-top:2px}
.how dd{margin:0;max-width:62ch}
.howbox{border:1px solid var(--line);padding:8px 10px}
.howbox summary{cursor:pointer;font-weight:700;font-size:12px}
.howbox[open] summary{margin-bottom:10px}
.reading .why{font-size:11.5px;color:var(--muted);line-height:1.5}
@media (max-width:520px){.how{grid-template-columns:minmax(0,1fr);gap:2px}.how dd{margin-bottom:8px}}

/* quiz */
.quiz{position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
.qwrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.qhead .sp{flex:1}
.qscore{display:flex;gap:20px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.qscore b{display:block;font-size:24px;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;text-transform:none}
.qgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.qphoto{border:1px solid var(--ink);background:#f1f1f1;display:flex;justify-content:center;align-items:center;min-height:320px}
.qphoto img{max-height:min(72vh,680px);width:auto;max-width:100%;display:block}
.qside{display:flex;flex-direction:column;gap:14px;min-width:0}
.qprompt{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.qpick{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:12px;align-items:start}
.qmap{border:1px solid var(--ink);display:block;width:100%;height:auto;background:#fff}
.qmap .qb{cursor:pointer;fill-opacity:.28;stroke-width:2;vector-effect:non-scaling-stroke}
.qmap .qb:hover{fill-opacity:.6}
.qmap.done .qb{cursor:default}
.qmap .qnum{font-family:var(--f-mono);font-weight:700;fill:#000;pointer-events:none}
.qopts{display:flex;flex-direction:column;gap:5px}
.qopt{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);background:#fff;padding:6px 8px 5px;text-align:left;cursor:pointer;font-weight:500;font-size:12.5px;line-height:1.25}
.qopt:hover:not([disabled]){background:var(--hover)}
.qopt[disabled]{cursor:default;opacity:.55}
.qopt .n{font-weight:700;width:1.4em;flex:none}
.qopt i{width:12px;height:12px;flex:none}
.qopt.truth{background:#000;color:#fff;opacity:1}
.qopt.mine{opacity:1;outline:3px solid var(--doubt);outline-offset:-3px}
.qopt.truth.mine{outline-color:var(--agree)}
.qres{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.qrow{display:grid;grid-template-columns:130px minmax(0,1fr) 22px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.qrow .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.qrow .what{min-width:0}
.qrow .what small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.qrow .mk{font-weight:700;text-align:right}
.qrow .mk.ok{color:var(--agree)} .qrow .mk.no{color:var(--doubt)}
.qrow.truthrow{background:#000;color:#fff;padding-inline:8px;grid-template-columns:122px minmax(0,1fr) 22px}
.qrow.truthrow .who{color:#bdbdbd}
.qactions{display:flex;gap:8px;flex-wrap:wrap}
.qend{display:flex;flex-direction:column;gap:16px;max-width:900px}
.qend h2{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;text-wrap:balance}
.qtable{border-collapse:collapse;width:100%;font-size:12.5px}
.qtable td,.qtable th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
.qtable th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.qtable img{width:44px;height:44px;object-fit:cover;display:block}
.qtable .ok{color:var(--agree);font-weight:700} .qtable .no{color:var(--doubt);font-weight:700}
@media (max-width:860px){
  .qgrid{grid-template-columns:minmax(0,1fr)}
  .qphoto{min-height:200px}
  .qphoto img{max-height:52vh}
}
@media (max-width:520px){
  .qpick{grid-template-columns:minmax(0,1fr)}
  .qmap{max-width:260px}
  .qrow{grid-template-columns:96px minmax(0,1fr) 20px}
}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3vw,34px);line-height:1;letter-spacing:-.04em;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.tally{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tally b{display:block;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.tally .warn b{color:var(--doubt)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--surface);border-radius:var(--r);padding:7px 12px 6px;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px 3px;font-size:12.5px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--doubt);color:var(--doubt)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px}

/* map */
.mapwrap{position:relative;min-height:0;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--water)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
#map.placing{cursor:crosshair}
.land{fill:var(--land);stroke:var(--coast)}
.boro{fill:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.12em;opacity:.55;pointer-events:none}
.grat{stroke:var(--coast);opacity:.35}
.pin{cursor:pointer}
.maptools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.maptools > *{pointer-events:auto}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px 4px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.zoom{display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:32px;padding:4px 0;text-align:center}
.legend{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:8px 10px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
.legend .k{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:0;display:inline-block;flex:none}
.note-ring{width:12px;height:12px;border-radius:0;border:2px dashed var(--doubt);display:inline-block}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:52px;background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:var(--r);font-size:12.5px;max-width:calc(100% - 20px);text-align:center}
.banner[hidden]{display:none}
.mapnote{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}

/* panel */
.panel{min-height:0;display:flex;flex-direction:column;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.panel-head .sp{flex:1}
.panel-body{flex:1;min-height:0;overflow:auto;padding:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:3px 8px 2px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:var(--paper);border:0;padding:0;cursor:pointer;display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tl{position:absolute;left:4px;bottom:4px;right:4px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tile .flag{position:absolute;top:4px;right:4px;font-family:var(--f-mono);font-size:9.5px;background:rgba(0,0,0,.65);color:#fff;border-radius:3px;padding:1px 4px}
.tile .dot{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.tile.sel{outline:3px solid var(--accent);outline-offset:-3px}
.empty{color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:10px;max-width:42ch}
.empty h3{margin:0;color:var(--ink);font-family:var(--f-display);font-size:18px;font-weight:800}
.empty ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

.detail{display:flex;flex-direction:column;gap:14px}
.photo{border-radius:4px;overflow:hidden;background:var(--paper);display:flex;justify-content:center}
.photo img{max-height:300px;width:auto;max-width:100%;display:block}
.photo .ph{height:160px;width:100%;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.fname{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
.rows{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13px;align-items:baseline}
.rows dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rows dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.rows dd a{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input[type=text],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);padding:7px 9px 6px}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--doubt)}
.reading{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.reading .src{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{position:relative;padding:2px 6px 1px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .t::before{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);opacity:.18}
.bar .t span{position:relative}
.bar .p{font-family:var(--f-mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.verdict{font-size:12.5px;font-weight:600;padding:5px 8px 4px;border-radius:4px}
.verdict.agree{background:color-mix(in srgb,var(--agree) 16%,transparent);color:var(--agree)}
.verdict.dis{background:color-mix(in srgb,var(--doubt) 16%,transparent);color:var(--doubt)}
.navrow{display:flex;gap:8px;flex-wrap:wrap}
.navrow .sp{flex:1}
.tag-demo{font-family:var(--f-mono);font-size:10.5px;background:var(--doubt);color:#fff;border-radius:3px;padding:2px 6px 1px;text-transform:uppercase;letter-spacing:.06em}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.sel{border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);padding:5px 8px 4px;max-width:100%}
.arealbl{font-family:var(--f-mono);font-weight:600;pointer-events:none}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* progress + toast */
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:var(--r);font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,12,.5);display:grid;place-items:center;z-index:40;padding:16px}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase}
.sheet p{margin:0;color:var(--muted);max-width:65ch}
.sheet textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet code{font-family:var(--f-mono);font-size:12px;background:var(--paper);padding:1px 4px;border-radius:3px}
.drop{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,transparent);border:4px dashed var(--accent);font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;color:var(--ink)}

@media (max-width:860px){

  .panel{max-height:none}
  .panel-body{overflow:visible}

}

}

// Walk dropped folders (and subfolders) to collect every file inside.
async function filesFromDrop(dt){
  const entries = [...dt.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const readAll = reader => new Promise(res => { const acc = []; const step = () => reader.readEntries(b => { if (!b.length) return res(acc); acc.push(...b); step(); }, () => res(acc)); step(); });
  async function walk(en){
    if (en.isFile) { try { out.push(await new Promise((res, rej) => en.file(res, rej))); } catch(e){} }
    else if (en.isDirectory) { for (const c of await readAll(en.createReader())) await walk(c); }
  }
  for (const en of entries) await walk(en);
  return out;
}

async function classifyAll(report){
  const recs = real().filter(r => imgSrc(r));
  const shape = S.model.inputs[0].shape, H = shape[1] || 224, W = shape[2] || 224;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d', {willReadFrequently:true});
  let done = 0;
  for (const r of recs){
    const blob = await (await fetch(imgSrc(r))).blob();
    const bmp = await createImageBitmap(blob);
    const s = Math.min(bmp.width, bmp.height);
    ctx.drawImage(bmp, (bmp.width - s)/2, (bmp.height - s)/2, s, s, 0, 0, W, H); bmp.close?.();
    const probs = tf.tidy(() => { const x = tf.browser.fromPixels(c).toFloat().sub(127.5).div(127.5).expandDims(0); return S.model.predict(x).dataSync(); });
    const top = [...probs].map((p, i) => ({label:S.modelLabels[i], confidence:+p.toFixed(4)})).sort((a,b) => b.confidence - a.confidence);
    await save(r.id, {tm:{label:top[0].label, confidence:top[0].confidence, top, model:S.modelName, at:new Date().toISOString()}});
    done++; report(`Classified ${done} of ${recs.length}…`);
    if (done % 10 === 0) { drawPins(); renderTally(); await sleep(0); }
  }
  render();
  report(`Done. ${done} photos classified. ${scoreText()}`);
}
async function importMobileNet(text, report = () => {}){
  if (!text.trim()){ report('Paste the JSON from the sketch into the box first.'); return null; }
  let data; try { data = JSON.parse(text); } catch(e){ report('That isn’t complete JSON. In the sketch, press Copy JSON again (or click in its box, Cmd+A, Cmd+C) and paste the whole thing.'); return null; }
  const rows = Array.isArray(data) ? data : Object.entries(data).map(([file, results]) => ({file, results}));
  const byName = new Map(); real().forEach(r => { byName.set(norm(r.name), r); byName.set(norm(r.name).replace(/\.[^.]+$/, ''), r); });
  let miss = 0; const jobs = [];
  for (const row of rows){
    const f = norm(row.file || row.name || ''), r = byName.get(f) || byName.get(f.replace(/\.[^.]+$/, ''));
    const res = row.results || row.top || (row.label ? [{label:row.label, confidence:row.confidence}] : []);
    if (!r || !res.length) { miss++; continue; }
    const top = res.slice(0, 3).map(x => ({label:String(x.label).split(',')[0], confidence:+(+x.confidence).toFixed(4)}));
    jobs.push([r.id, {mn:{label:top[0].label, confidence:top[0].confidence, top}}]);
  }
  // save ten at a time and show progress
  let hit = 0;
  for (let i = 0; i < jobs.length; i += 10){
    await Promise.all(jobs.slice(i, i + 10).map(([id, patch]) => save(id, patch)));
    hit = Math.min(jobs.length, i + 10);
    report(`Saving ${hit} of ${jobs.length}…`);
  }
  render();
  return `Matched ${hit} MobileNet readings to your photos` + (miss ? `; ${miss} didn’t match any file name here.` : '.') + ' ' + scoreText();
}

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function splitTable(){
  const rows = AREAS.map(a => a.name).concat(OTHER).map(n => {
    const list = real().filter(r => areaOf(r) === n);
    return {n, total:list.length, hes:list.filter(hesitated).length, train:list.filter(r => r.split === 'train').length, test:list.filter(r => r.split === 'test').length};
  }).filter(r => r.total);
  const sum = k => rows.reduce((s, r) => s + r[k], 0);
  return `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Neighborhood</th><th>Photos</th><th>Hesitated</th><th>Training</th><th>Testing</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.n === OTHER ? 'Other neighborhoods (not used)' : r.n)}</td><td>${r.total}</td><td>${r.hes}</td><td>${r.train}</td><td>${r.test}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${sum('total')}</b></td><td><b>${sum('hes')}</b></td><td><b>${sum('train')}</b></td><td><b>${sum('test')}</b></td></tr></tbody></table></div>`;
}
// Stratified split: each neighborhood keeps the same share for testing (at least one photo),
// so the test set looks like the archive. Hesitated photos fill test slots first when asked.
async function makeSplit(nTrain, hesFirst, report){
  const updates = [];
  const groups = {}; real().forEach(r => (groups[areaOf(r)] ||= []).push(r));
  const usable = real().filter(r => areaOf(r) !== OTHER).length, nTest = Math.max(0, usable - nTrain);
  for (const [a, list] of Object.entries(groups)){
    let testIds;
    if (a === OTHER) testIds = new Set(list.map(r => r.id));
    else {
      const k = Math.min(list.length - 1, Math.max(1, Math.round(list.length * nTest / usable)));
      const order = hesFirst ? shuffle(list.filter(hesitated)).concat(shuffle(list.filter(r => !hesitated(r)))) : shuffle(list.slice());
      testIds = new Set(order.slice(0, k).map(r => r.id));
    }
    list.forEach(r => { const s = testIds.has(r.id) ? 'test' : 'train'; if (r.split !== s) updates.push([r.id, s]); });
  }
  for (let i = 0; i < updates.length; i += 8){
    await Promise.all(updates.slice(i, i + 8).map(([id, s]) => save(id, {split:s})));
    report(`Saving ${Math.min(i + 8, updates.length)} of ${updates.length}…`);
  }
  render();
}
async function zipTraining(area, report){
  await loadScript(JSZIP_URL);
  const zip = new JSZip(), list = real().filter(r => r.split === 'train' && areaOf(r) !== OTHER && (!area || areaOf(r) === area));
  let i = 0;
  for (const r of list){
    const src = imgSrc(r); if (!src) continue;
    const blob = await (await fetch(src)).blob();
    zip.folder(areaOf(r)).file(r.name.replace(/\.[^.]+$/, '') + '.jpg', blob);
    report(`Packing ${++i} of ${list.length}…`);
  }
  return zip.generateAsync({type:'blob'});
}

// Zooming the quiz map: pinch or ctrl-scroll zooms, two-finger swipe or drag pans, mouse wheel zooms.
function qZoom(svgEl){
  const vb = svgEl.viewBox.baseVal, home = {x:vb.x, y:vb.y, w:vb.width, h:vb.height};
  Q.vb = {...home}; Q.vbHome = home;
  const apply = () => { svgEl.setAttribute('viewBox', `${Q.vb.x} ${Q.vb.y} ${Q.vb.w} ${Q.vb.h}`); if (Q.choice){ qMark(Q.choice, 'chosen'); qPin(); } };
  const zoomAt = (f, cx, cy) => {
    const r = svgEl.getBoundingClientRect(), k = Math.min(r.width / Q.vb.w, r.height / Q.vb.h);
    const ox = (r.width - Q.vb.w * k) / 2, oy = (r.height - Q.vb.h * k) / 2;
    const mx = Q.vb.x + (cx - r.left - ox) / k, my = Q.vb.y + (cy - r.top - oy) / k;
    const nw = Math.min(home.w, Math.max(home.w / 10, Q.vb.w / f)), nh = nw * home.h / home.w;
    Q.vb = {x:mx - (mx - Q.vb.x) * nw / Q.vb.w, y:my - (my - Q.vb.y) * nh / Q.vb.h, w:nw, h:nh}; apply();
  };
  const panBy = (dx, dy) => { const r = svgEl.getBoundingClientRect(), k = Math.min(r.width / Q.vb.w, r.height / Q.vb.h); Q.vb.x += dx / k; Q.vb.y += dy / k; apply(); };
  svgEl.addEventListener('wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : 1, dx = e.deltaX * unit, dy = e.deltaY * unit;
    if (e.ctrlKey) return zoomAt(Math.exp(-dy * .011), e.clientX, e.clientY);
    if (e.deltaMode === 1 || (dx === 0 && Math.abs(dy) >= 50 && Number.isInteger(e.deltaY))) return zoomAt(Math.exp(-dy * .0022), e.clientX, e.clientY);
    panBy(dx, dy);
  }, {passive:false});

// The machine's side of the results: the two models and how they add up, then each one's breakdown.

function qScratch(){

  x.globalAlpha = 1; x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `${Math.min(26, W / 14)}px "Apfel Grotezk", sans-serif`; x.fillText('SCRATCH TO REVEAL', W / 2, H / 2 - 6);

async function shrinkJpeg(blob, max, q){
  const bmp = await createImageBitmap(blob), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}
async function exportExhibit(report, small){

  root.file('index.html', tpl);

// so the motion travels across the map. It pauses while you pan, zoom or look at something else.
const CH = {cur:null, seen:new Set(), n:0};

  const v = S.view, {W, H} = size(), x = (+g.dataset.x - v.x0) * v.s, y = (+g.dataset.y - v.y0) * v.s;
  return x > 60 && x < W - 60 && y > 90 && y < H - 60;

  const live = isFront() && S.screen === 'map' && $('viewer').hidden && !Q.on && !reduceMotion() && !document.hidden && Date.now() - S.lastTouch > 1800;
  if (live){
    let pool = [...svg.querySelectorAll('.thumb')].filter(g => g !== hovered && !g.classList.contains('picked') && !CH.seen.has(g.dataset.id) && inView(g));
    if (!pool.length || CH.n >= 40){ CH.seen.clear(); CH.n = 0; CH.cur = null; pool = [...svg.querySelectorAll('.thumb')].filter(g => g !== hovered && inView(g)); }

      const cx = +CH.cur.dataset.x, cy = +CH.cur.dataset.y; let best = Infinity;
      for (const g of pool){ const d = (g.dataset.x - cx) ** 2 + (g.dataset.y - cy) ** 2; if (d < best){ best = d; next = g; } }

// ----- order (last = on top) -----
const PL_SORTS = [['date-new','Newest on top'], ['date-old','Oldest on top'], ['north','North on top'], ['south','South on top'], ['small','Small on top'], ['big','Big on top'], ['area','Grouped by neighborhood'], ['random','Shuffled'], ['manual','My own order']];
function plSorted(list, mode){
  const t = r => r.takenAt ? Date.parse(r.takenAt) || 0 : 0;
  const by = f => list.slice().sort((a, b) => f(a) - f(b) || a.id.localeCompare(b.id));
  switch (mode){
    case 'date-old': return by(r => -t(r));
    case 'north': return by(r => r.lat ?? 0);
    case 'south': return by(r => -(r.lat ?? 0));
    case 'small': return by(r => -plSizeOf(r));
    case 'big': return by(r => plSizeOf(r));
    case 'area': return list.slice().sort((a, b) => placeName(a).localeCompare(placeName(b)) || t(a) - t(b));
    case 'random': return by(r => hashId(r.id + ':' + PS.L.seed));

function plApplySort(){ if (PS.L.sort !== 'manual') PS.L.order = plSorted(real(), PS.L.sort).map(r => r.id); }

  const idx = new Map(PS.L.order.map((id, i) => [id, i]));

    if (j < 0 || j >= full.length) return;

// ----- placement: exact spot, then pushed apart so photos overlap less -----
function plPlace(lay){
  const L = PS.L, f = lay.frame, b = L.border * PT;
  const items = [];
  for (const r of plOrdered()){
    const [ax, ay] = plToU(r.lat, r.lng, f);
    if (ax < f.x - 2 || ax > f.x + f.w + 2 || ay < f.y - 2 || ay > f.y + f.h + 2) continue;
    const [w, h] = plBox(r), o = L.off[r.id];
    items.push({r, ax, ay, w, h, x:ax + (o ? o[0] : 0), y:ay + (o ? o[1] : 0), fixed:!!o});

  const k = L.spread, n = items.length;
  if (k > 0 && n > 1){
    const gap = 4 + b * 2, iters = Math.round(15 + 85 * k), pull = .05 * (1 - k * .85);
    for (let t = 0; t < iters; t++){
      for (let i = 0; i < n; i++){
        const A = items[i];
        for (let j = i + 1; j < n; j++){
          const B = items[j];
          const ox = (A.w + B.w) / 2 + gap - Math.abs(A.x - B.x); if (ox <= 0) continue;
          const oy = (A.h + B.h) / 2 + gap - Math.abs(A.y - B.y); if (oy <= 0) continue;
          if (A.fixed && B.fixed) continue;
          const wa = A.fixed ? 0 : B.fixed ? 1 : .5, wb = 1 - wa;
          if (ox < oy){ const d = ox * k * (A.x <= B.x ? -1 : 1); A.x += d * wa; B.x -= d * wb; }
          else { const d = oy * k * (A.y <= B.y ? -1 : 1); A.y += d * wa; B.y -= d * wb; }

    it.x = f.w > 2 * hx ? Math.min(f.x + f.w - hx, Math.max(f.x + hx, it.x)) : f.x + f.w / 2;
    it.y = f.h > 2 * hy ? Math.min(f.y + f.h - hy, Math.max(f.y + hy, it.y)) : f.y + f.h / 2;
  }
  return items;
}

// ----- drawing -----
const PL_TITLE_FONT = s => `${s}px "Apfel Grotezk Brukt","Apfel Grotezk","Helvetica Neue",Arial,sans-serif`;
const PL_BODY_FONT = s => `${s}px "Apfel Grotezk","Helvetica Neue",Arial,sans-serif`;
function plPaths(){
  return PS.paths ||= {
    land: new Path2D(LAND_D), nta: new Path2D(NTA_D),
    areas: AREAS.map(a => new Path2D('M' + a.poly.map(([la, ln]) => P(la, ln).map(n => n.toFixed(2)).join(' ')).join('L') + 'Z')),
  };
}
function plCaption(r){
  const c = PS.L.caption;
  if (c === 'area') return placeName(r);
  if (c === 'date') return r.takenAt ? new Date(r.takenAt).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) : '';
  if (c === 'coords') return Math.abs(r.lat).toFixed(4) + '°N ' + Math.abs(r.lng).toFixed(4) + '°W';

}
function plInfo(){
  const list = plPhotos(), ts = list.map(r => Date.parse(r.takenAt)).filter(Number.isFinite).sort((a, b) => a - b);
  const fm = t => new Date(t).toLocaleDateString(undefined, {month:'short', year:'numeric'});
  const span = ts.length ? (fm(ts[0]) === fm(ts[ts.length - 1]) ? fm(ts[0]) : fm(ts[0]) + ' – ' + fm(ts[ts.length - 1])) : '';

}
function plFitText(ctx, text, font, size, maxLen){

}

// ----- preview -----
function plSizeCanvas(){
  const st = $('plStage'), cv = $('plCanvas'); if (!st || !PS.L) return;
  const {W, H} = plDims(), pad = 28;
  const k = Math.max(.05, Math.min((st.clientWidth - pad * 2) / W, (st.clientHeight - pad * 2) / H));
  PS.k = k; PS.dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.style.width = Math.round(W * k) + 'px'; cv.style.height = Math.round(H * k) + 'px';
  cv.width = Math.round(W * k * PS.dpr); cv.height = Math.round(H * k * PS.dpr);
  PS.dirty = true; plRedraw();
}
function plRedraw(recompute){
  if (recompute) PS.dirty = true;

  PS.raf = requestAnimationFrame(() => {
    PS.raf = 0; if (!PS.open) return;
    const cv = $('plCanvas'), ctx = cv.getContext('2d');
    PS.lay = plLayout();
    if (PS.dirty){ PS.items = plPlace(PS.lay); PS.dirty = false; }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    plDraw(ctx, PS.k * PS.dpr, PS.lay, PS.items, true);

}
function plLoadImages(){
  const need = real().filter(r => imgSrc(r) && !PS.imgs.has(r.id));
  if (!need.length) return PS.loading || Promise.resolve();
  let done = 0; const total = need.length, stat = $('plStat');
  const one = r => new Promise(res => {
    const im = new Image(); im.decoding = 'async';
    im.onload = () => { PS.imgs.set(r.id, im); res(); };
    im.onerror = () => res();
    im.src = imgSrc(r);
  }).then(() => { done++; if (stat) stat.textContent = done < total ? `Loading photos ${done} of ${total}…` : ''; if (done % 12 === 0 || done === total) plRedraw(true); });
  PS.loading = (async () => { for (let i = 0; i < need.length; i += 8) await Promise.all(need.slice(i, i + 8).map(one)); })();

}
function plEventU(e){

}

  }

}

    else if (e.key === 'ArrowUp') nudge(0, -step);
    else if (e.key === 'ArrowDown') nudge(0, step);
    else if (e.key === ']'){ plMove(PS.sel, e.shiftKey ? 'front' : 'up'); plRedraw(true); plSave(); plPanel(); }
    else if (e.key === '['){ plMove(PS.sel, e.shiftKey ? 'back' : 'down'); plRedraw(true); plSave(); plPanel(); }
    else if (e.key === 'Backspace' || e.key === 'Delete'){ PS.L.hidden.push(PS.sel); PS.sel = null; plRedraw(true); plSave(); plPanel(); }
    else return;
    e.preventDefault();
  });
}

// ----- control panel -----
function plRange(k, label, min, max, step, unit, fmt){
  const v = PS.L[k];
  return `<label class="pf"><span>${label}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}"><output data-o="${k}">${fmt ? fmt(v) : v + unit}</output></label>`;
}
function plSelect(k, label, opts){
  return `<label class="pf wide"><span>${label}</span><select data-k="${k}">${opts.map(([val, t]) => `<option value="${esc(val)}" ${String(PS.L[k]) === String(val) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
}
const plCheck = (k, label) => `<label class="pchk"><input type="checkbox" data-k="${k}" ${PS.L[k] ? 'checked' : ''}> ${label}</label>`;
const plText = (k, label, ph) => `<label class="pf wide"><span>${label}</span><input type="text" data-k="${k}" value="${esc(PS.L[k])}" placeholder="${esc(ph || '')}"></label>`;
const PL_FMT = {margin:v => (+v).toFixed(2) + ' in', size:v => (+v).toFixed(2) + ' in', titleSize:v => v + ' pt', border:v => v + ' pt', tilt:v => v + '°', spread:v => Math.round(v * 100) + '%',
  fillOp:v => Math.round(v * 100) + '%', lineW:v => v + ' pt', landW:v => v + ' pt', capSize:v => v + ' pt', selScale:v => '×' + (+v).toFixed(2)};
function plPanel(){
  const L = PS.L, side = $('plSide'); if (!side) return;
  const keep = side.scrollTop;
  const sel = PS.sel && S.recs.get(PS.sel);
  const hiddenN = L.hidden.length;
  const areaOpts = [['all', 'All photos'], ['areas', 'Only the 10 neighborhoods'], ...AREAS.map(a => [a.name, a.name])];
  side.innerHTML = `
    ${sel ? `<div class="pgrp psel">
      <h3>Selected photo <small>arrow keys nudge</small></h3>
      <div class="pselhead"><img src="${esc(imgSrc(sel))}" alt=""><div><b>${esc(placeName(sel))}</b><span>${sel.takenAt ? esc(new Date(sel.takenAt).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})) : 'Date unknown'}</span></div></div>
      <label class="pf"><span>Size</span><input type="range" data-sel="scale" min=".3" max="4" step=".05" value="${L.scale[sel.id] || 1}"><output data-o="selScale">${PL_FMT.selScale(L.scale[sel.id] || 1)}</output></label>
      <div class="prow">
        <button class="btn" type="button" data-act="front">To front</button>
        <button class="btn" type="button" data-act="up">Forward</button>
        <button class="btn" type="button" data-act="down">Backward</button>
        <button class="btn" type="button" data-act="back">To back</button>
      </div>
      <div class="prow">
        <button class="btn" type="button" data-act="reset" ${L.off[sel.id] || L.scale[sel.id] ? '' : 'disabled'}>Put back in place</button>
        <button class="btn" type="button" data-act="hide">Leave off poster</button>
      </div>
    </div>` : ''}
    <div class="pgrp">
      <h3>Page</h3>
      ${plSelect('page', 'Size', Object.entries(PL_PAGES).map(([k, v]) => [k, v[2]]))}
      ${plSelect('orient', 'Orientation', [['portrait', 'Portrait (tall)'], ['landscape', 'Landscape (wide)']])}
      ${plRange('margin', 'Margin', 0, 1.5, .05, '', PL_FMT.margin)}
      ${plCheck('full', 'Map runs to the edge of the page')}
    </div>
    <div class="pgrp">
      <h3>Text</h3>
      ${plText('title', 'Title')}
      ${plSelect('titlePos', 'Title goes', [['left', 'Up the left side'], ['top', 'Across the top'], ['over', 'On the map'], ['none', 'No title']])}
      ${plRange('titleSize', 'Title size', 24, 320, 2, '', PL_FMT.titleSize)}
      ${plCheck('footer', 'Footer line')}
      ${L.footer ? plText('sub', 'Footer text', plInfo()) : ''}
      ${L.footer && L.fill !== 'none' ? plCheck('legend', 'Key for the 10 neighborhoods') : ''}
    </div>
    <div class="pgrp">
      <h3>Map</h3>
      <div class="prow" style="margin-top:0">
        <button class="btn" type="button" data-act="fit">Fit to photos</button>
        <button class="btn" type="button" data-act="city">Whole city</button>
      </div>
      ${plSelect('fill', 'My 10 areas', [['none', 'Not marked'], ['fill', 'Colored in'], ['outline', 'Colored outlines']])}
      ${L.fill === 'fill' ? plRange('fillOp', 'Color strength', .05, 1, .05, '', PL_FMT.fillOp) : ''}
      ${plCheck('nta', 'All neighborhood lines')}
      ${L.nta ? plRange('lineW', 'Line weight', .1, 3, .1, '', PL_FMT.lineW) : ''}
      ${plRange('landW', 'Shoreline', 0, 4, .1, '', PL_FMT.landW)}
    </div>
    <div class="pgrp">
      <h3>Photos <small>${plPhotos().length} on the poster</small></h3>
      ${plSelect('who', 'Show', areaOpts)}
      ${plRange('size', 'Size', .25, 3, .05, '', PL_FMT.size)}
      ${plSelect('vary', 'Sizes', [['random', 'Mixed'], ['same', 'All the same'], ['feature', 'A few big ones']])}
      ${plSelect('shape', 'Shape', [['natural', 'As taken'], ['square', 'Square'], ['circle', 'Circle']])}
      ${plRange('border', 'Border', 0, 14, .5, '', PL_FMT.border)}

      ${plCheck('leaders', 'Line from a moved photo to its spot')}
      ${plCheck('dots', 'Dot on the exact spot')}
      ${plSelect('caption', 'Caption', [['none', 'None'], ['area', 'Neighborhood'], ['date', 'Date'], ['coords', 'Coordinates']])}
      ${L.caption !== 'none' ? plRange('capSize', 'Caption size', 4, 14, .5, '', PL_FMT.capSize) : ''}
      ${hiddenN ? `<div class="prow"><button class="btn" type="button" data-act="unhide">Put back ${hiddenN} left-off photo${hiddenN === 1 ? '' : 's'}</button></div>` : ''}
    </div>
    <div class="pgrp">
      <h3>Order</h3>
      ${plSelect('sort', 'On top', PL_SORTS)}
      <div class="prow">${L.sort === 'random' ? '<button class="btn" type="button" data-act="shuffle">Shuffle again</button>' : ''}</div>
      <p class="pnote">Click a photo on the poster to move it forward or back, resize it, or leave it off. Keys: [ and ] step it back or forward; Shift jumps all the way.</p>
    </div>
    <div class="pgrp">
      <h3>Colors</h3>
      <div class="pswatches">${Object.entries(PL_PRESETS).map(([k, p]) => `<button class="pswatch" type="button" data-preset="${k}" aria-pressed="${L.preset === k}"><i style="background:linear-gradient(90deg,${p.bg} 0 34%,${p.land} 34% 67%,${p.lines} 67%)"></i><span>${esc(p.name)}</span></button>`).join('')}</div>
      <div class="pcolors">${PL_COLORS.map(([k, t]) => `<label class="pf"><span>${t}</span><input type="color" data-k="${k}" value="${esc(L[k])}"></label>`).join('')}</div>
    </div>
    <div class="pgrp">
      <h3>Start over</h3>
      <p class="pnote">Puts every photo back on its spot at its normal size, brings back left-off photos and resets the order. Colors and text stay.</p>
      <div class="prow"><button class="btn" type="button" data-act="resetall">Reset photo layout</button></div>
    </div>`;
  side.scrollTop = keep;
}
const PL_REFIT = new Set(['page', 'orient']);
const PL_REPANEL = new Set(['fill', 'nta', 'footer', 'caption', 'who', 'sort', 'titlePos']);
function plWirePanel(){
  const side = $('plSide');
  side.addEventListener('input', e => {
    const el = e.target, k = el.dataset.k, L = PS.L;
    if (el.dataset.sel === 'scale' && PS.sel){
      L.scale[PS.sel] = +el.value;
      side.querySelector('[data-o="selScale"]').textContent = PL_FMT.selScale(el.value);
      plRedraw(true); plSave(); return;
    }
    if (!k) return;
    let val = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
    L[k] = val;
    if (PL_COLORS.some(c => c[0] === k)){ L.preset = ''; side.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', 'false')); }
    const o = side.querySelector(`[data-o="${k}"]`); if (o) o.textContent = PL_FMT[k] ? PL_FMT[k](val) : val;
    if (k === 'sort' || k === 'vary') plApplySort();
    if (PL_REFIT.has(k)){ plSizeCanvas(); plFit('photos'); }
    plRedraw(true); plSave();
    if (el.tagName === 'SELECT' || el.type === 'checkbox'){ if (PL_REPANEL.has(k) || k === 'legend') plPanel(); }
  });
  side.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const L = PS.L, act = b.dataset.act;
    if (b.dataset.preset){ Object.assign(L, PL_PRESETS[b.dataset.preset]); L.preset = b.dataset.preset; delete L.name; }
    else if (act === 'fit') plFit('photos');
    else if (act === 'city') plFit('city');
    else if (act === 'shuffle'){ L.seed = (L.seed || 1) + 1; plApplySort(); }
    else if (act === 'unhide') L.hidden = [];
    else if (act === 'resetall'){ L.off = {}; L.scale = {}; L.hidden = []; if (L.sort === 'manual') L.sort = 'date-new'; plApplySort(); }
    else if (PS.sel && ['front', 'up', 'down', 'back'].includes(act)) plMove(PS.sel, act);
    else if (PS.sel && act === 'reset'){ delete L.off[PS.sel]; delete L.scale[PS.sel]; }
    else if (PS.sel && act === 'hide'){ L.hidden.push(PS.sel); PS.sel = null; }
    else return;
    plRedraw(true); plSave(); plPanel();
  });
}

// ----- open, close, export -----
let plWired = false;
async function plOpen(){
  if (!real().length) return toast('Add photos first.');
  if (!PS.L) await plLoad();
  $('poster').hidden = false; PS.open = true; document.body.style.overflow = 'hidden';
  if (!plWired){ plWire(); plWirePanel(); plWired = true; }
  plSizeCanvas();
  if (!PS.L.view) plFit('photos');
  plPanel(); plRedraw(true);
  document.fonts?.load(PL_TITLE_FONT(40)).then(() => plRedraw());
  plLoadImages();
}
function plClose(){
  $('poster').hidden = true; PS.open = false; PS.sel = null; document.body.style.overflow = '';
}
// One-page PDF holding the poster as a single print-resolution JPEG, at the page's real size in points.
async function plPdf(jpg, pw, ph, wPt, hPt){
  const enc = t => new TextEncoder().encode(t), img = new Uint8Array(await jpg.arrayBuffer());
  const draw = `q ${wPt.toFixed(2)} 0 0 ${hPt.toFixed(2)} 0 0 cm /Im0 Do Q`;
  const objs = [
    enc('<</Type/Catalog/Pages 2 0 R>>'),
    enc('<</Type/Pages/Kids[3 0 R]/Count 1>>'),
    enc(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${wPt.toFixed(2)} ${hPt.toFixed(2)}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`),
    [enc(`<</Type/XObject/Subtype/Image/Width ${pw}/Height ${ph}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${img.length}>>\nstream\n`), img, enc('\nendstream')],
    enc(`<</Length ${draw.length}>>\nstream\n${draw}\nendstream`),
  ];
  const parts = [enc('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')], offs = [];
  let pos = parts[0].length;
  objs.forEach((o, i) => {
    offs.push(pos);
    const chunk = [enc(`${i + 1} 0 obj\n`), ...(Array.isArray(o) ? o : [o]), enc('\nendobj\n')];
    chunk.forEach(c => { parts.push(c); pos += c.length; });
  });
  const xref = 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('')
    + `trailer\n<</Size ${objs.length + 1}/Root 1 0 R>>\nstartxref\n${pos}\n%%EOF\n`;
  parts.push(enc(xref));
  return new Blob(parts, {type:'application/pdf'});
}
async function plExport(kind){
  const stat = $('plStat'), btns = [$('plPdf'), $('plPng')];
  if (!S.dl) return toast('Downloads aren’t available in this view. Open the Atlas on claude.ai to download.');
  btns.forEach(b => b.disabled = true);
  try {
    stat.textContent = 'Waiting for photos…';
    await plLoadImages();
    await Promise.all([document.fonts?.load(PL_TITLE_FONT(40)), document.fonts?.load(PL_BODY_FONT(12))]);
    const {W, H} = plDims();
    let dpi = Math.min(+$('plDpi').value || 300, Math.floor(Math.sqrt(60e6 / (W * H / 1e4))));
    for (;;){
      stat.textContent = `Drawing at ${dpi} dpi…`;
      await sleep(30);
      const k = dpi / 100, cv = document.createElement('canvas');
      cv.width = Math.round(W * k); cv.height = Math.round(H * k);
      const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality = 'high';
      const lay = plLayout(); plDraw(ctx, k, lay, plPlace(lay), false);
      let blob;
      if (kind === 'png') blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('the page is too big for this browser')), 'image/png'));
      else {
        const jpg = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('the page is too big for this browser')), 'image/jpeg', .92));
        blob = await plPdf(jpg, cv.width, cv.height, W / 100 * 72, H / 100 * 72);
      }
      cv.width = cv.height = 0;
      const page = (PL_PAGES[PS.L.page] || PL_PAGES.tabloid)[2].split(' · ')[0].toLowerCase().replace(/\s+/g, '');
      const filename = `new-york-state-of-trash-poster-${page}.${kind}`;
      stat.textContent = 'Waiting for you to confirm the download…';
      try { await S.dl.save({filename, data:blob}); stat.textContent = `Saved ${filename} (${dpi} dpi).`; break; }
      catch(e){
        if (e?.code === 'too_large' && dpi > 120){ dpi = dpi > 200 ? 200 : 150; if (dpi === 150 && kind === 'png') dpi = 120; continue; }
        throw e;
      }
    }
  } catch(e){
    stat.textContent = e?.code === 'declined' ? 'Download cancelled.' : 'Could not export: ' + (e?.message || e?.code || e);
  } finally { btns.forEach(b => b.disabled = false); }
}
$('posterBtn').onclick = plOpen;
